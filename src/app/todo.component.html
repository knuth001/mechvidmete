<section class="todo-shell">
  <h1>Todo List</h1>

  <div class="todo-add">
    <input
      type="text"
      placeholder="Add new todo"
      [value]="newText()"
      (input)="newText.set($any($event.target).value)"
    />
    <button type="button" (click)="addTodo()">Add</button>
  </div>

  <ul class="todo-list">
    <li *ngFor="let todo of todos$ | async" class="todo-item">
      <div class="todo-row">
        <label>
          <input
            type="checkbox"
            [checked]="todo.completed"
            (change)="toggleCompleted(todo)"
          />
          <span [class.completed]="todo.completed">{{ todo.text }}</span>
        </label>

        <div class="todo-actions">
          <button type="button" (click)="startEdit(todo)">Edit</button>
          <button type="button" (click)="removeTodo(todo.id)">Delete</button>
        </div>
      </div>

      <div *ngIf="editingId() === todo.id" class="edit-row">
        <input
          type="text"
          [value]="editText()"
          (input)="editText.set($any($event.target).value)"
        />
        <button type="button" (click)="saveEdit(todo)">Save</button>
        <button type="button" (click)="cancelEdit()">Cancel</button>
      </div>
    </li>
  </ul>
</section>
